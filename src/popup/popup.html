<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS2 copy !gen</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <img src="../icon-48.png" alt="" width="36" height="36">
        <div>
            <h1>CS2 copy !gen</h1>
            <p id="version"></p>
        </div>
    </header>

    <section>
        <h2>Websites</h2>
        <label class="row"><span class="name">CSFloat<small>csfloat.com</small></span><input type="checkbox" data-group="sites" data-key="csfloat"><i></i></label>
        <label class="row"><span class="name">BUFF163<small>buff.163.com</small></span><input type="checkbox" data-group="sites" data-key="buff163"><i></i></label>
        <label class="row"><span class="name">BUFF Market<small>buff.market</small></span><input type="checkbox" data-group="sites" data-key="buffmarket"><i></i></label>
        <label class="row"><span class="name">SkinSwap<small>skinswap.com</small></span><input type="checkbox" data-group="sites" data-key="skinswap"><i></i></label>
        <label class="row"><span class="name">CS.MONEY<small>cs.money</small></span><input type="checkbox" data-group="sites" data-key="csmoney"><i></i></label>
        <label class="row"><span class="name">Steam inventory<small>steamcommunity.com</small></span><input type="checkbox" data-group="sites" data-key="steam"><i></i></label>
    </section>

    <section>
        <h2>Extras</h2>
        <label class="row"><span class="name">3D viewer button<small>SkinSwap</small></span><input type="checkbox" data-group="features" data-key="view3d"><i></i></label>
        <label class="row"><span class="name">Fade percentage<small>SkinSwap · Fade, Amber Fade, Acid Fade</small></span><input type="checkbox" data-group="features" data-key="fade"><i></i></label>
    </section>

    <footer>
        <p id="hint" hidden>Reload the page to apply the changes.</p>
        <a href="https://github.com/ffuNnyto/cs2gen-extension" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>

    <script src="../util/settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
